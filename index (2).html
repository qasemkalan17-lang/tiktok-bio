<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Empfehlungen</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0B192C 0%, #1E3E62 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #E1B24B;
            box-shadow: 0 0 15px rgba(225, 178, 75, 0.4);
            object-fit: cover;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #E1B24B;
            margin-bottom: 4px;
        }

        .handle {
            font-size: 0.9rem;
            color: #8FA4BB;
            margin-bottom: 24px;
            display: block;
            text-decoration: none;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background: rgba(30, 62, 98, 0.6);
            border: 2px solid #E1B24B;
            border-radius: 12px;
            padding: 16px;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .link-card:hover {
            transform: translateY(-3px);
            background: rgba(225, 178, 75, 0.15);
            box-shadow: 0 6px 20px rgba(225, 178, 75, 0.3);
        }

        .link-card span {
            font-size: 1.2rem;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #8FA4BB;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profilbereich -->
        <img class="profile-img" src="https://via.placeholder.com/150" alt="Profilbild">
        <h1>Mein TikTok Name</h1>
        <a href="https://www.tiktok.com/@dein_tiktok_handle" class="handle" target="_blank">@dein_tiktok_handle</a>

        <!-- Affiliate Links -->
        <div class="links-container">
            
            <a href="HIER_DEIN_AMAZON_LINK_1" class="link-card" target="_blank">
                <span>📦</span> Produkt Empfehlung 1
            </a>

            <a href="HIER_DEIN_AMAZON_LINK_2" class="link-card" target="_blank">
                <span>🔥</span> Mein Top Must-Have
            </a>

            <a href="HIER_DEIN_AMAZON_LINK_3" class="link-card" target="_blank">
                <span>💡</span> Praktisches Gadget
            </a>

            <a href="HIER_DEIN_AMAZON_LINK_4" class="link-card" target="_blank">
                <span>✨</span> Neuheit aus dem Video
            </a>

        </div>

        <div class="footer">
            *Als Amazon-Partner verdiene ich an qualifizierten Verkäufen.
        </div>
    </div>

</body>
</html>
